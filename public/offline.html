<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17594f" />
    <title>Çevrimdışısınız | Kur'an Öğren</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #173f39;
        background: #faf7f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 560px);
        padding: clamp(28px, 7vw, 52px);
        text-align: center;
        background: #fff;
        border: 1px solid #e6ded0;
        border-radius: 28px;
        box-shadow: 0 18px 45px rgb(23 89 79 / 12%);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 82px;
        height: 82px;
        margin: 0 auto 22px;
        border-radius: 24px;
        color: #f6dba9;
        background: #17594f;
        font-family: serif;
        font-size: 52px;
      }
      h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: clamp(32px, 8vw, 46px); }
      p { margin: 0 0 28px; color: #53706b; font-size: 18px; line-height: 1.65; }
      button {
        min-height: 52px;
        padding: 0 28px;
        border: 0;
        border-radius: 14px;
        color: #fff;
        background: #17594f;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button:focus-visible { outline: 4px solid #f5bd69; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">و</div>
      <h1>Bağlantı bekleniyor</h1>
      <p>İnternet bağlantınızı kontrol edin. Daha önce ziyaret ettiğiniz derslerin bir bölümü çevrimdışı kullanılabilir.</p>
      <button type="button" onclick="window.location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
